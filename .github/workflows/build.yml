name: Almeida Tavares Air Force - WebApp e Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar WebApp/PWA
        run: npm run build
      - name: Arquivar WebApp
        uses: actions/upload-artifact@v4
        with:
          name: Almeida-Tavares-Air-Force-WebApp
          path: dist/
      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Criar projeto nativo Android
        run: npx cap add android
      - name: Sincronizar WebApp com Android
        run: npx cap sync android
      - name: Instalar ícone pessoal no Android
        run: python3 scripts/install_android_icons.py
      - name: Aplicar versão Android crescente
        run: python3 scripts/prepare_android.py '${{ github.run_number }}'
      - name: Compilar APK de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Preparar artefactos
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Almeida-Tavares-Air-Force-TESTE.apk
      - name: Criar APK de atualização (quando há assinatura privada)
        env:
          RJP_KEYSTORE_B64: ${{ secrets.RJP_KEYSTORE_B64 }}
          RJP_STORE_PASSWORD: ${{ secrets.RJP_STORE_PASSWORD }}
          RJP_KEY_ALIAS: ${{ secrets.RJP_KEY_ALIAS }}
          RJP_KEY_PASSWORD: ${{ secrets.RJP_KEY_PASSWORD }}
        run: |
          if [ -z "$RJP_KEYSTORE_B64" ] || [ -z "$RJP_STORE_PASSWORD" ] || [ -z "$RJP_KEY_ALIAS" ] || [ -z "$RJP_KEY_PASSWORD" ]; then
            echo "Sem os quatro secrets: foi criado apenas um APK de TESTE. Para atualizações sem desinstalar, ver README."
            exit 0
          fi
          printf '%s' "$RJP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cesar-release.jks"
          export RJP_KEYSTORE_PATH="$RUNNER_TEMP/cesar-release.jks"
          python3 scripts/configure_signing.py
          (
            cd android
            ./gradlew assembleRelease --no-daemon
          )
          cp android/app/build/outputs/apk/release/app-release.apk apk/Almeida-Tavares-Air-Force-ATUALIZAVEL.apk
      - name: Publicar APK para transferência
        uses: actions/upload-artifact@v4
        with:
          name: Almeida-Tavares-Air-Force-Android-APK
          path: apk/*.apk

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar PWA no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
